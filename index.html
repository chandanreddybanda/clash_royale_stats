<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clash Royale Pro Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0f1014" />
    <style>
      :root {
        --bg-color: #0f1014;
        --card-bg: #1b1d24;
        --text-main: #ffffff;
        --text-muted: #8a8d96;
        --accent-win: #00d26a;
        --accent-loss: #f94144;
        --accent-draw: #577590;
        --border-color: #2d3039;
      }
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      /* --- HEADER (FIXED) --- */
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 25px;
        padding-bottom: 20px;
        border-bottom: 1px solid #333;
        gap: 20px;
      }

      .header-left {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .header-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }

      .profile-main {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .level-badge {
        background: #0099ff;
        color: white;
        padding: 2px 8px;
        border-radius: 6px;
        font-weight: 800;
        font-size: 1.1rem;
        border: 2px solid #0055aa;
      }
      h1 {
        font-weight: 800;
        font-size: 2.2rem;
        margin: 0;
        line-height: 1.1;
      }
      .clan-info {
        color: var(--text-muted);
        font-size: 0.95rem;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .clan-badge {
        color: #ffc107;
      }

      select {
        background: #333;
        color: white;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #444;
        cursor: pointer;
        font-size: 0.9rem;
      }
      .meta-info {
        font-size: 0.8rem;
        color: var(--text-muted);
      }
      .highlight {
        color: #ffc107;
        font-weight: bold;
      }

      /* --- BENTO GRID --- */
      .bento-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }
      .card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 20px;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .card h3 {
        margin-top: 0;
        color: var(--text-muted);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 15px;
        font-weight: 600;
      }

      .col-span-1 {
        grid-column: span 1;
      }
      .col-span-2 {
        grid-column: span 2;
      }
      .col-span-4 {
        grid-column: span 4;
      }
      .row-span-2 {
        grid-row: span 2;
      }

      /* KPI & FAV CARD */
      .kpi-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-top: auto;
      }
      .kpi-block {
        text-align: left;
      }
      .kpi-number {
        font-size: 2.2rem;
        font-weight: 800;
        display: block;
        line-height: 1;
      }
      .kpi-label {
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-top: 5px;
        display: block;
      }

      .fav-card-img {
        height: 55px;
        position: absolute;
        right: 20px;
        top: 20px;
        filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.5));
        z-index: 10;
      }

      .form-bar {
        display: flex;
        gap: 3px;
        height: 12px;
        align-items: center;
        margin-top: auto;
      }
      .form-segment {
        flex: 1;
        height: 100%;
        border-radius: 2px;
      }

      /* CHARTS & LISTS */
      .match-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
        padding-right: 5px;
      }
      .match-row {
        display: grid;
        grid-template-columns: 80px 1fr 100px;
        align-items: center;
        background: #252830;
        padding: 10px 15px;
        border-radius: 8px;
        border-left: 4px solid transparent;
      }
      .match-row.win {
        border-left-color: var(--accent-win);
      }
      .match-row.loss {
        border-left-color: var(--accent-loss);
      }
      .deck-strip {
        display: flex;
        gap: 4px;
        justify-content: center;
      }
      .deck-strip img {
        width: 28px;
        height: 34px;
        object-fit: contain;
      }
      .res-box {
        font-weight: 800;
        font-size: 1.1rem;
      }
      .res-box.win {
        color: var(--accent-win);
      }
      .res-box.loss {
        color: var(--accent-loss);
      }

      .nemesis-item {
        display: flex;
        align-items: center;
        background: #252830;
        margin-bottom: 6px;
        padding: 8px;
        border-radius: 6px;
      }
      .nemesis-rank {
        font-weight: bold;
        color: #555;
        width: 20px;
        font-size: 0.9rem;
      }
      .nemesis-img {
        width: 32px;
        margin-right: 12px;
      }
      .nemesis-name {
        flex-grow: 1;
        font-weight: 600;
        font-size: 0.85rem;
      }
      .nemesis-count {
        color: var(--accent-loss);
        font-weight: bold;
        font-size: 0.9rem;
      }

      /* --- MOBILE OPTIMIZATION --- */
      @media (max-width: 1000px) {
        .bento-grid {
          grid-template-columns: 1fr;
        }
        .col-span-1,
        .col-span-2,
        .col-span-4 {
          grid-column: span 1;
        }
      }

      @media (max-width: 600px) {
        /* Fix Header Stacking */
        header {
          flex-direction: column;
          align-items: flex-start;
          gap: 15px;
        }
        .header-right {
          width: 100%;
          align-items: flex-start;
          flex-direction: row; /* Put Select and Time on same row */
          justify-content: space-between;
          align-items: center;
        }
        select {
          flex-grow: 1;
          margin-right: 10px;
        }

        /* Fix KPI Sizes */
        .kpi-number {
          font-size: 1.8rem;
        }
        h1 {
          font-size: 1.6rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-left">
          <div class="profile-main">
            <span class="level-badge" id="player-level">00</span>
            <h1 id="player-name">Loading...</h1>
          </div>
          <div class="clan-info">
            <span class="clan-badge">🛡</span> <span id="clan-name">...</span>
          </div>
        </div>

        <div class="header-right">
          <select id="modeFilter">
            <option value="PvP_Ladder">⚔️ PvP Ladder</option>
            <option value="PvP_All">🔥 All PvP</option>
            <option value="All">🌍 All Battles</option>
          </select>
          <div class="meta-info">
            Updated: <span id="last-updated" class="highlight">--</span>
          </div>
        </div>
      </header>

      <div class="bento-grid">
        <div class="card col-span-2">
          <h3>Season & Career</h3>
          <img id="fav-card" class="fav-card-img" src="" alt="" />
          <div class="kpi-row" style="margin-top: 30px">
            <div class="kpi-block">
              <span class="kpi-number highlight" id="current-trophies">0</span>
              <span class="kpi-label">Current Trophies</span>
            </div>
            <div class="kpi-block">
              <span class="kpi-number" id="best-trophies" style="color: #aaa"
                >0</span
              >
              <span class="kpi-label">Personal Best</span>
            </div>
            <div class="kpi-block">
              <span
                class="kpi-number"
                id="total-wins"
                style="color: var(--accent-win)"
                >0</span
              >
              <span class="kpi-label">Total Wins</span>
            </div>
          </div>
        </div>

        <div class="card col-span-1">
          <h3>Win Rate (Log)</h3>
          <div style="height: 100px; position: relative">
            <canvas id="winRateChart"></canvas>
            <div
              style="
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-weight: bold;
                font-size: 1.4rem;
              "
            >
              <span id="win-pct">0%</span>
            </div>
          </div>
        </div>

        <div class="card col-span-1">
          <h3>Form (Last 30)</h3>
          <div
            style="
              flex-grow: 1;
              display: flex;
              flex-direction: column;
              justify-content: center;
            "
          >
            <div
              style="
                display: flex;
                justify-content: space-between;
                margin-bottom: 10px;
              "
            >
              <span class="kpi-number" id="current-streak">0</span>
              <span class="kpi-number" id="net-trophies">+0</span>
            </div>
            <div class="form-bar" id="form-bar"></div>
          </div>
        </div>

        <div class="card col-span-2">
          <h3>Trophy Progression (Last 50)</h3>
          <div style="height: 200px">
            <canvas id="trophyChart"></canvas>
          </div>
        </div>

        <div class="card col-span-2">
          <h3>Activity by Hour (IST)</h3>
          <div style="height: 200px">
            <canvas id="hourChart"></canvas>
          </div>
        </div>

        <div
          class="card col-span-2 row-span-2"
          style="max-height: 600px; overflow-y: auto"
        >
          <h3>Nemesis Cards</h3>
          <div id="nemesis-list"></div>
        </div>

        <div class="card col-span-2 row-span-2" style="max-height: 600px">
          <h3>Match History</h3>
          <div class="match-list" id="match-list"></div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
