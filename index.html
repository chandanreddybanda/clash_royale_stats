<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Royale Battle Stats</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Verdana', sans-serif; background-color: #1a1a1a; color: #f0f0f0; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: #ffcc00; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .card { background: #2a2a2a; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .match-list { list-style: none; padding: 0; }
        .match-item { background: #333; padding: 10px; margin-bottom: 5px; display: flex; justify-content: space-between; border-radius: 5px; }
        .win { border-left: 5px solid #4caf50; }
        .loss { border-left: 5px solid #f44336; }
        .chart-container { position: relative; height: 300px; }
        
        @media (max-width: 600px) { .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ Battle Log Dashboard</h1>
        
        <div class="stats-grid">
            <div class="card">
                <h3 style="text-align:center">Win Rate (Ladder)</h3>
                <div class="chart-container">
                    <canvas id="winRateChart"></canvas>
                </div>
            </div>

            <div class="card">
                <h3 style="text-align:center">Top Cards You Lose Against</h3>
                <div class="chart-container">
                    <canvas id="nemesisChart"></canvas>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Recent Matches</h3>
            <ul id="matchHistory" class="match-list"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
