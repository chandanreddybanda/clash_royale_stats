name: Daily Clash Royale Fetch

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: "0 0 * * *"
  # Allows you to run it manually from the Actions tab for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Fetch Script
        env:
          # This pulls the token from your Repo Secrets
          CR_API_TOKEN: ${{ secrets.CR_API_TOKEN }}
        run: python fetch_log.py

      - name: Commit and Push Data
        run: |
          git config user.name "Automated Bot"
          git config user.email "actions@users.noreply.github.com"
          git add battlelog_master.json
          # Commit with a timestamp
          git commit -m "Update master log: $(date +'%Y-%m-%d')" || exit 0
          git push
